services:
  curriculum-vitae:
    image: ghcr.io/dominik-97/curriculum-vitae:latest
    container_name: curriculum-vitae
    restart: unless-stopped
    labels:
      # Traefik configuration
      - traefik.enable=true
      - traefik.http.routers.${SUBDOMAIN}.rule=Host(`${SUBDOMAIN}.${TRAEFIK_HOST}`)
      - traefik.http.routers.${SUBDOMAIN}.entrypoints=websecure
      - traefik.http.routers.${SUBDOMAIN}.tls.certresolver=letsencrypt
      - traefik.http.services.${SUBDOMAIN}.loadbalancer.server.port=80
    environment:
      - TZ=UTC
    healthcheck:
      # Probes Nginx's /health endpoint (see nginx.conf). Traefik and
      # `docker compose ps` use this to report container health.
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
