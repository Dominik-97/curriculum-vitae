name: Deploy Redirect Page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'static-redirect.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp static-redirect.html index.html
      - run: touch .nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
