name: Deploy Redirect Page to GitHub Pages

on:
  push:
    branches: [main, gh-pages]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: cp static-redirect.html index.html
      - run: touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
