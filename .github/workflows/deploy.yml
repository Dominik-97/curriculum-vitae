name: Build and Deploy CV to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.hostinger.yml'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.eslintrc.cjs'

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: curriculum-vitae

jobs:
  quality:
    name: Quality checks
    uses: ./.github/workflows/quality.yml

  build-and-push:
    name: Build and Push Docker Image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.REPO_OWNER_LOWER }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Set these as repository Variables (Settings -> Secrets and variables
          # -> Actions -> Variables). Empty values simply disable analytics.
          # --- Currently enabled
          build-args: |
            VITE_UMAMI_SRC=${{ vars.VITE_UMAMI_SRC }}
            VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}

  deploy:
    name: Deploy to Hostinger VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    
    env:
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_SSH_PORT: 22
      HOSTINGER_DEPLOY_PATH: /root/cv
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
      
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$HOSTINGER_SSH_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          scp -P "$HOSTINGER_SSH_PORT" -o StrictHostKeyChecking=no \
            docker-compose.hostinger.yml \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_DEPLOY_PATH/"
          
          ssh -p "$HOSTINGER_SSH_PORT" -o StrictHostKeyChecking=no \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "cd $HOSTINGER_DEPLOY_PATH && \
            docker compose -f docker-compose.hostinger.yml pull && \
            docker compose -f docker-compose.hostinger.yml up -d && \
            docker image prune -f"
