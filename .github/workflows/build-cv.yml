name: Build CV PDFs

on:
  push:
    branches:
      - main
    paths:
      - 'tex-source/**'
      - 'assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required LaTeX packages
        run: |
          tlmgr update --self
          tlmgr install moderncv geometry subfiles fancyhdr

      - name: Build English CV
        run: |
          cd tex-source
          pdflatex -interaction=nonstopmode cv_en.tex
          pdflatex -interaction=nonstopmode cv_en.tex
          pdflatex -interaction=nonstopmode cv_en.tex
          mv cv_en.pdf ../cv_en.pdf

      - name: Build Czech CV
        run: |
          cd tex-source
          pdflatex -interaction=nonstopmode cv_cz.tex
          pdflatex -interaction=nonstopmode cv_cz.tex
          pdflatex -interaction=nonstopmode cv_cz.tex
          mv cv_cz.pdf ../cv_cz.pdf

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cv_en.pdf
            cv_cz.pdf
          tag_name: cv-pdf-${{ github.sha }}
          name: CV PDFs (${{ github.sha }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
