name: Build CV PDFs

on:
  push:
    branches:
      - pdf-cv-update
    paths:
      - 'tex-source/**'
      - 'assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install required LaTeX packages
        run: |
          tlmgr update --self
          tlmgr install moderncv geometry subfiles fancyhdr

      - name: Build English CV
        run: |
          cd tex-source
          pdflatex -interaction=nonstopmode cv_en.tex
          pdflatex -interaction=nonstopmode cv_en.tex
          pdflatex -interaction=nonstopmode cv_en.tex
          mv cv_en.pdf ../cv_en.pdf

      - name: Build Czech CV
        run: |
          cd tex-source
          pdflatex -interaction=nonstopmode cv_cz.tex
          pdflatex -interaction=nonstopmode cv_cz.tex
          pdflatex -interaction=nonstopmode cv_cz.tex
          mv cv_cz.pdf ../cv_cz.pdf

      - name: Build English Cover Letter
        run: |
          cd tex-source
          pdflatex -interaction=nonstopmode Cover_Letter_en.tex
          pdflatex -interaction=nonstopmode Cover_Letter_en.tex
          mv Cover_Letter_en.pdf ../Cover_Letter_en.pdf

      - name: Build Czech Cover Letter
        run: |
          cd tex-source
          pdflatex -interaction=nonstopmode Cover_Letter_cz.tex
          pdflatex -interaction=nonstopmode Cover_Letter_cz.tex
          mv Cover_Letter_cz.pdf ../Cover_Letter_cz.pdf

      - name: Commit and push PDFs
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add cv_en.pdf cv_cz.pdf Cover_Letter_en.pdf Cover_Letter_cz.pdf
          git diff --cached --quiet || git commit -m "Auto-build CV PDFs from LaTeX sources"
          git push
